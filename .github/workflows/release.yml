name: Release LivePad

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Verify and package
        shell: pwsh
        run: |
          .\verify.ps1
          .\package.ps1
          .\bundle_all.ps1

      - name: Validate release bundle
        shell: pwsh
        run: .\tools\verify_release.ps1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LivePad-${{ github.ref_name }}
          path: |
            release/LivePad-Complete.zip
            release/LivePad-Complete.zip.sha256
            release/LivePad-Extension.zip
            release/LivePad-Extension.zip.sha256
            release/LivePad-Instant/LivePad.exe
            release/LivePad-Instant/LivePad.exe.sha256
            release/commands_guide.html

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/LivePad-Complete.zip
            release/LivePad-Complete.zip.sha256
            release/LivePad-Extension.zip
            release/LivePad-Extension.zip.sha256
            release/LivePad-Instant/LivePad.exe
            release/LivePad-Instant/LivePad.exe.sha256
            release/commands_guide.html
